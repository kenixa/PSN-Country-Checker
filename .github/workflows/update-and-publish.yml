name: PSN Top 20 aktualisieren und veröffentlichen

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eneba-top20-pages
  cancel-in-progress: false

jobs:
  scan-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages-Konfiguration lesen
        id: pages
        uses: actions/configure-pages@v5

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Länderpreise abrufen und data.json aktualisieren
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/update_data.py

      - name: GitHub-Pages-Artefakt erstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: scan-and-build
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
